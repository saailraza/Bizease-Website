<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BizBook — BIZEASE Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g9:#0A2A20;--g8:#0F3B2E;--g7:#1A5240;--g6:#2B6B55;--b0:#FFFDF8;--b1:#FBF7EE;--b2:#F3EBDA;--b3:#E6D9BD;--b4:#CDBB93;--ink:#16251E;--mut:#6C7567;--pos:#1E6B4E;--neg:#A3412B;--warn:#B8832B;--r:14px;--sw:272px;
--serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--b2);color:var(--ink);font:15px/1.45 var(--sans)}
button,input,select,textarea{font-family:inherit}
a{color:var(--g7)}
h1,h2,h3{font-family:var(--serif);margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:25px;line-height:1.15}h2{font-size:19px;line-height:1.2}h3{font-size:17px}
.ic{flex:none;vertical-align:middle}
.mut{color:var(--mut)}.sm{font-size:12.5px}.b{font-weight:700}.r{text-align:right}.c{text-align:center}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.num{font-variant-numeric:tabular-nums}

/* ===== layout: sidebar + main ===== */
.side{position:fixed;top:0;bottom:0;left:0;width:var(--sw);max-width:86vw;background:var(--g8);color:var(--b2);z-index:40;display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .25s ease;box-shadow:6px 0 24px rgba(0,0,0,.25)}
.side.open{transform:none}
.sb-head{padding:calc(env(safe-area-inset-top) + 16px) 16px 14px;display:flex;gap:11px;align-items:center;border-bottom:1px solid var(--g7)}
.sb-head .bn{font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.1;letter-spacing:.12em}
.sb-head .cn{font-size:12px;color:var(--b4);max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-nav{flex:1;overflow-y:auto;padding:6px 10px 14px}
.sb-sec{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--b4);margin:16px 10px 5px;opacity:.85;font-weight:700}
.sb-nav a,.sb-nav button.li{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--b3);text-decoration:none;font-size:14.5px;font-weight:600;width:100%;background:none;border:0;cursor:pointer;text-align:left;margin-bottom:2px}
.sb-nav a:hover,.sb-nav button.li:hover{background:rgba(243,235,218,.08)}
.sb-nav a.on{background:rgba(243,235,218,.15);color:#fff}
.sb-nav .tag{margin-left:auto;color:var(--b4);display:flex}
.sb-nav .cntb{margin-left:auto;background:#E8B54A;color:#2c1f00;border-radius:99px;font-size:11.5px;font-weight:700;padding:1px 8px}
.sb-foot{border-top:1px solid var(--g7);padding:11px 14px calc(11px + env(safe-area-inset-bottom));font-size:12.5px;color:var(--b4)}
.sb-foot b{display:block;color:var(--b2);font-size:13.5px}
.scrim{position:fixed;inset:0;background:rgba(10,42,32,.5);z-index:35;display:none}
.scrim.on{display:block}
.main{min-width:0;min-height:100vh}
.hdr{position:sticky;top:0;z-index:20;background:var(--g8);color:var(--b2);padding:calc(env(safe-area-inset-top) + 9px) 14px 9px;display:flex;align-items:center;gap:10px}
.hdr .hb{background:rgba(243,235,218,.12);border-color:transparent;color:var(--b2)}
.hdr .ttl{min-width:0}.hdr .bn{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .cn{font-size:12px;color:var(--b4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sp{flex:1}
.hdr img.lg{width:36px;height:36px;border-radius:10px;object-fit:cover;background:var(--b2)}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 60px}
.ph{margin:6px 2px 14px}.ph p{margin:5px 0 0;color:var(--mut)}
@media(min-width:700px){.wrap{max-width:900px;padding:18px 22px 60px}}
@media(min-width:1024px){
  .side{transform:none;box-shadow:none;max-width:none}
  .main{margin-left:var(--sw)}
  .hb,.scrim,.scrim.on{display:none!important}
  .wrap{max-width:1120px;padding:24px 32px 70px}
  .hdr{padding-left:28px;padding-right:28px}
  h1{font-size:29px}
}

/* cards, forms */
.card{background:var(--b0);border:1px solid var(--b3);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card>h3,.card>h2{margin-bottom:10px}
.fld{margin-bottom:11px}
.fld label,.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--g7);margin-bottom:4px}
input,select,textarea{width:100%;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--b4);border-radius:10px;padding:10px 12px;min-height:46px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--g6);box-shadow:0 0 0 3px rgba(43,107,85,.18)}
input[disabled],select[disabled]{background:var(--b2);color:var(--mut)}
input[type=checkbox]{width:20px;height:20px;min-height:0;padding:0;accent-color:var(--g7);flex:none}
input[type=file]{padding:9px;font-size:14px}
.ms.pk{display:flex;gap:11px;align-items:center}
.ms.pk i{width:21px;height:21px;border:2px solid var(--g7);border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:14px;line-height:1}
.ms.pk.on{background:var(--b1)}.ms.pk.on i{background:var(--g8);border-color:var(--g8)}.ms.pk.on i:after{content:'\2713'}
.mstools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.sb-foot a,.auth .foot a{color:inherit;text-decoration:underline;font-weight:700}
.tk{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--b3);padding:11px 2px;cursor:pointer;color:var(--ink);font:inherit}
.tk .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.tk b{font-size:15px}
.tkm{border-radius:12px;padding:9px 12px;margin:8px 0;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.tkm.u{background:var(--b1);border:1px solid var(--b3)}.tkm.a{background:#E4F1EA;border:1px solid #BCD9C9}
.tkm small{display:block;color:var(--mut);font-size:11.5px;margin-bottom:3px}
.pwrap{position:relative}.pwrap input{padding-right:48px}
.pwb{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;color:var(--g7);display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;padding:0}
.pwb:active{background:var(--b2)}
.chk{display:flex;align-items:flex-start;gap:10px;margin:8px 0;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--g8);color:var(--b1);font:600 15px var(--sans);cursor:pointer;width:100%;text-decoration:none}
.btn:active{background:var(--g9)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--g8);border:1.5px solid var(--g8)}
.btn.tan{background:var(--b3);color:var(--g9)}
.btn.danger{background:var(--neg);color:#fff}
.btn.s{min-height:38px;padding:0 13px;font-size:13.5px;width:auto}
.btn+.btn{margin-top:8px}
.btn.s+.btn.s{margin-top:0}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--b3);background:var(--b1);color:var(--g8);display:inline-grid;place-items:center;cursor:pointer;padding:0}
.ib.red{color:var(--neg)}
.row{display:flex;gap:10px;align-items:center}.row.end{justify-content:flex-end}.row.sb{justify-content:space-between}.row.fw{flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2 .fld{margin-bottom:0}.g2{margin-bottom:11px}
@media(max-width:380px){.g2.rs{grid-template-columns:1fr}}
.lnk{background:none;border:0;color:var(--g7);font-weight:600;font-size:13px;padding:4px 0;cursor:pointer;text-decoration:underline}
.search{position:relative;margin-bottom:10px}.search input{padding-left:40px}.search .ic{position:absolute;left:12px;top:13px;color:var(--mut)}
.sel{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--b4);border-radius:10px;background:#fff;font-size:16px;text-align:left;cursor:pointer;color:var(--ink)}
.sel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel.ph span{color:var(--mut)}.sel .ic{color:var(--mut)}
.pklist{max-height:52vh;overflow:auto;margin:0 -4px}
.pk{display:block;width:100%;text-align:left;padding:12px 8px;border:0;border-bottom:1px solid var(--b3);background:none;font-size:15px;cursor:pointer;color:var(--ink)}
.pk:hover,.pk:active{background:var(--b2)}

/* badges + banners */
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.st-full{background:#CFE5DA;color:#0F3B2E}.st-partial{background:#E8DAB4;color:#5C4510}.st-trial{background:#F6E3B0;color:#6A4A06}.st-suspended,.st-rejected{background:#EFCFC6;color:#7A2A18}.st-pending{background:#D5DEEA;color:#27415F}
.t-Income{background:#CFE5DA;color:#0F3B2E}.t-Expense{background:#EFCFC6;color:#7A2A18}
.banner{border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:#F6E3B0;color:#5A3F05}.banner.bad{background:#EFCFC6;color:#6B2413}.banner.info{background:#D5DEEA;color:#27415F}
.banner a{font-weight:700}
.empty{text-align:center;padding:26px 14px;color:var(--mut)}.empty.small{padding:16px}
.empty h2{color:var(--ink);margin:10px 0 6px}

/* dashboard */
.hero{background:var(--g8);color:var(--b2);border-radius:20px;padding:18px 16px 16px 30px;margin-bottom:12px;position:relative;overflow:hidden;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(243,235,218,.08) 31px 32px)}
.hero:before{content:'';position:absolute;left:16px;top:0;bottom:0;width:1px;background:rgba(205,187,147,.45)}
.hero .k{font-size:13px;color:var(--b4)}
.hero .big{font-family:var(--serif);font-size:38px;font-weight:700;line-height:1.1;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(243,235,218,.12);border-radius:10px;padding:6px 10px;font-size:12.5px}
.chip b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.qa .btn{min-height:56px;font-size:15.5px}.qa .btn+.btn{margin-top:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--b0);border:1px solid var(--b3);border-radius:var(--r);padding:12px}
.stat .k{font-size:12.5px;color:var(--mut)}.stat .v{font-family:var(--serif);font-size:21px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px;margin-top:8px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%}
.bp{flex:1;width:100%;display:flex;gap:3px;align-items:flex-end}
.bp i{flex:1;border-radius:4px 4px 0 0;min-height:2px;display:block}
.br{background:var(--g7)}.bq{background:var(--b4)}
.bcol span{font-size:11px;color:var(--mut)}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut)}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dgrid{display:grid;gap:12px}
@media(min-width:900px){.dgrid.two{grid-template-columns:1fr 1fr}.dgrid.two .card{margin-bottom:0}}

/* entries */
.rowcard{background:var(--b1);border:1px solid var(--b3);border-radius:12px;padding:11px;margin-bottom:10px}
.rowcard .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;color:var(--g7);font-size:13px}
.rowcard .fld{margin-bottom:9px}
.totalbar{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--g8);color:var(--b2);border-radius:12px;padding:12px 14px;margin:6px 0 12px}
.totalbar b{font-family:var(--serif);font-size:24px;font-variant-numeric:tabular-nums}
.ecard{background:var(--b0);border:1px solid var(--b3);border-radius:var(--r);padding:12px;margin-bottom:10px}
.ecard .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ecard .amt{font-family:var(--serif);font-weight:700;font-size:19px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lines{list-style:none;margin:8px 0;padding:8px 0;border-top:1px dashed var(--b4);border-bottom:1px dashed var(--b4)}
.lines li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:14px}
.lines li i{display:block;font-style:normal;font-size:12px;color:var(--mut)}
.ecard .f{display:flex;gap:8px;justify-content:flex-end}
@media(min-width:1024px){.elist{display:grid;grid-template-columns:1fr 1fr;gap:10px}.elist .ecard{margin-bottom:0}.elist>.btn,.elist>.empty{grid-column:1/-1}}

/* tables */
.tw{overflow-x:auto;margin:0 -4px;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:100%}
.tbl th{background:var(--b2);color:var(--g8);text-align:left;padding:8px 8px;font-weight:700;white-space:nowrap;border-bottom:1px solid var(--b4)}
.tbl td{padding:8px;border-bottom:1px solid var(--b3);vertical-align:top}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.tot td{font-weight:700;background:var(--b2);border-top:1.5px solid var(--g8)}
.tbl tr.sec td{font-weight:700;color:var(--g8);background:var(--b1);padding-top:12px}
.rep h2{margin-bottom:2px}.rep .sub{color:var(--mut);font-size:13px;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--b3);font-size:15px}
.kv.big{font-weight:700;font-size:16.5px;border-bottom:2px solid var(--g8)}
.rbar{display:flex;gap:8px;margin-bottom:12px}.rbar .btn{flex:1;margin:0}
.sig{display:flex;justify-content:space-between;margin-top:46px;font-size:13px}.sig div{border-top:1px solid var(--ink);padding-top:5px;min-width:42%;text-align:center}

/* lists */
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--b3)}
.item:last-child{border-bottom:0}
.item .l{min-width:0}.item .l b{display:block;overflow-wrap:anywhere}
.item .rt{text-align:right;white-space:nowrap}
.grp{font-weight:700;color:var(--g7);padding:10px 8px 2px;font-family:var(--serif)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-bottom:12px}
.cc{background:var(--b0);border:1px solid var(--b3);border-radius:var(--r);padding:13px}
.cc.flag{border-color:#D9A08F;box-shadow:inset 4px 0 0 var(--neg)}
.cc dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0;font-size:13.5px}.cc dt{color:var(--mut)}.cc dd{margin:0;overflow-wrap:anywhere}
.cc .acts{display:flex;gap:6px;flex-wrap:wrap}
.cnt{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-bottom:12px}
.cnt div{background:var(--b0);border:1px solid var(--b3);border-radius:12px;padding:9px;text-align:center}
.cnt b{display:block;font-family:var(--serif);font-size:22px}.cnt span{font-size:12px;color:var(--mut)}
.bill{background:var(--b0);border:1px solid var(--b3);border-radius:var(--r);padding:12px;margin-bottom:10px;display:grid;gap:6px}
.bill .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.bill .amt{font-family:var(--serif);font-weight:700;font-size:20px;white-space:nowrap}
.bill.over{border-color:#D9A08F;background:#FDF3EF}
.bill .f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* auth */
.auth{min-height:100vh;display:flex;flex-direction:column}
.auth .top{background:var(--g8);color:var(--b2);padding:calc(env(safe-area-inset-top) + 30px) 22px 62px;position:relative;overflow:hidden;text-align:center;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(243,235,218,.07) 31px 32px)}
.auth .top>div{display:flex;flex-direction:column;align-items:center}
.auth .top svg{display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.auth .top h1{font-size:30px;margin:14px 0 0;letter-spacing:.14em;line-height:1.1;padding-left:.14em}
.auth .top p{margin:8px 0 0;color:var(--b4);font-size:13.5px;max-width:300px}
.auth .box{max-width:460px;width:100%;margin:-34px auto 0;padding:0 14px 30px;position:relative}
.auth .card{padding:18px 16px;box-shadow:0 8px 24px rgba(10,42,32,.10)}
.auth .card h2{text-align:center;margin-bottom:4px}
.auth .card .hint{text-align:center;margin:0 0 14px}
.auth .foot{text-align:center;color:var(--mut);font-size:12.5px;padding:0 0 24px;margin-top:auto}
.auth .top>div{max-width:460px;margin:0 auto}
.gate{max-width:560px;margin:0 auto;padding:22px 14px 60px}
.gate .card{text-align:center;padding:24px 18px}
.gate .card h2{margin:10px 0 8px}

/* modal + toast */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,42,32,.55);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--b1);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin-bottom:10px}.sheet p{margin:0 0 14px}
@media(min-width:600px){#modal{align-items:center}.sheet{border-radius:20px}}
#toasts{position:fixed;left:12px;right:12px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--g9);color:var(--b1);padding:11px 16px;border-radius:12px;font-size:14px;max-width:440px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.err{background:var(--neg)}

/* print preview */
#printSheet{display:none}
body.printing>*:not(#printSheet){display:none!important}
body.printing{background:#fff}
body.printing #printSheet{display:block;max-width:760px;margin:0 auto;padding:14px;background:#fff;color:#000}
#printSheet .bar{display:flex;gap:10px;margin-bottom:16px}#printSheet .bar .btn{flex:1;margin:0}
#printSheet .ph1{display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--g8);padding-bottom:10px;margin-bottom:12px}
#printSheet .ph1 img{width:54px;height:54px;object-fit:contain}
#printSheet h2{margin:8px 0 2px}
#printSheet .card{border:0;padding:0;background:none}
#printSheet .tbl th{background:#eee}
#printSheet .foot{margin-top:24px;font-size:11px;color:#666;text-align:center}
@media print{body.printing{background:#fff}.noprint{display:none!important}@page{margin:12mm}}
@media(prefers-reduced-motion:no-preference){.toast{animation:up .25s ease}@keyframes up{from{transform:translateY(8px);opacity:0}}}
@media(prefers-reduced-motion:reduce){.side{transition:none}}
.ss-h{display:none!important}
.ssp{position:fixed;z-index:200;background:#fff;border:1px solid var(--b4);border-radius:14px;box-shadow:0 14px 36px rgba(10,42,32,.28);padding:10px;display:flex;flex-direction:column}
.ssp .search{margin-bottom:6px;flex:none}
.ssp .ssl{overflow:auto;min-height:0;flex:1;margin:0 -4px}
.pk.on{font-weight:700}.pk.hl{background:var(--b2)}
.sel:disabled{opacity:.6;cursor:not-allowed}
.vals{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toasts"></div>

/* ---------- hashing (offline demo-level) ---------- */
function hash(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}

/* ---------- storage ---------- */
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){memOnly=true}return null}

const BUILTIN_ADMIN={email:'admin@bizease.com',pass:pw('BizEase@123')};
function seed(){return{v:2,super:{name:'BIZEASE Admin',email:'admin@bizease.com',pass:pw('BizEase@123'),cell:''},companies:[],users:[],coa:[],parties:[],entries:[],vouchers:[],costCenters:[],items:[],trades:[],billing:[],requests:[],logs:[],tickets:[],seq:{},session:null}}

const billNo=()=>{DB.seq._bill=(DB.seq._bill||0)+1;return 'INV-'+String(DB.seq._bill).padStart(4,'0')};
function normalize(){
  ['companies','users','coa','parties','entries','vouchers','costCenters','items','trades','billing','requests','logs','tickets'].forEach(k=>{DB[k]=DB[k]||[]});
  DB.seq=DB.seq||{};DB.super=DB.super||seed().super;DB.super.cell=DB.super.cell||'';
  DB.companies.forEach(c=>{
    if(!Array.isArray(c.modules))c.modules=c.status==='partial'?[]:MODS.map(m=>m[0]);
    if(!c.tradeAdded){c.tradeAdded=true;if((c.status==='trial'||c.status==='full')&&!c.modules.includes('trade'))c.modules.push('trade')}
    if(c.maxUsers==null)c.maxUsers=10;
    if(c.fee==null)c.fee=0;
    if(c.nextDue==null)c.nextDue='';
    if(!Array.isArray(c.cashHeads))c.cashHeads=DB.coa.filter(h=>h.companyId===c.id&&(h.type==='Cash'||h.type==='Bank')).map(h=>h.id);
  });
  DB.users.forEach(migratePerms);
  DB.costCenters=migrateCC(DB.costCenters,[DB.entries,DB.vouchers]);
  DB.companies.forEach(c=>{
    if(!Array.isArray(c.receiptHeads))c.receiptHeads=(c.cashHeads||[]).slice();
    if(!Array.isArray(c.paymentHeads))c.paymentHeads=(c.cashHeads||[]).slice();
    syncCash(c);
  });
  DB.billing.forEach(b=>{if(!b.dueDate){b.dueDate=b.date||today();b.issueDate=b.dueDate;b.status='paid';b.paidAt=b.at||Date.now();b.no=b.no||billNo();b.monthly=false;b.auto=false}});
}
/* cost center v3: a cost center has a name + a list of values; lines store {ccId:value} in r.cc */
function migrateCC(ccs,lists){
  const out=[],byKey={},map={};
  (ccs||[]).forEach(c=>{
    if(!('value' in c)&&Array.isArray(c.values)){out.push(c);return}
    const k=(c.companyId||'')+'|'+String(c.name||'').toLowerCase();
    let n=byKey[k];if(!n){n=byKey[k]={id:uid(),companyId:c.companyId,name:c.name,values:[]};out.push(n)}
    if(c.value&&!n.values.includes(c.value))n.values.push(c.value);
    map[c.id]={cc:n.id,v:c.value};
  });
  lists.forEach(l=>(l||[]).forEach(x=>(x.rows||[]).forEach(r=>{
    if(r.c1===undefined&&r.c2===undefined)return;
    r.cc=r.cc||{};
    ['c1','c2'].forEach(f=>{const m=map[r[f]];if(m&&m.v)r.cc[m.cc]=m.v;delete r[f]});
  })));
  return out;
}
const syncCash=c=>{c.cashHeads=[...new Set([...(c.receiptHeads||[]),...(c.paymentHeads||[])])]};
function init(){DB=load()||seed();normalize()}

function download(name,text,mime,bom){const b=new Blob([(bom?'\ufeff':'')+text],{type:mime||'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)}

function parseCSV(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}if(c!==''||r.length){r.push(c);rows.push(r)}return rows.filter(x=>x.some(y=>String(y).trim()!==''))}

/* ---------- billing engine ---------- */
function mkBill(cid,amount,due,note,monthly,auto){return{id:uid(),no:billNo(),companyId:cid,amount:r2(amount),issueDate:today(),dueDate:due,status:'due',paidAt:0,note:note||'',monthly:!!monthly,auto:!!auto,at:Date.now()}}
function autoBilling(){
  let ch=false;
  DB.companies.forEach(c=>{
    if((c.status==='full'||c.status==='partial')&&c.fee>0&&c.nextDue&&today()>=addDays(c.nextDue,-BILL_ADVANCE)&&!DB.billing.some(b=>b.companyId===c.id&&b.monthly&&b.dueDate===c.nextDue)){
      DB.billing.push(mkBill(c.id,c.fee,c.nextDue,'Monthly plan fee ('+ST[c.status]+')',true,true));ch=true;
    }
  });
  if(ch)save();
}
const isOver=b=>b.status==='due'&&b.dueDate<today();
const overdueBills=c=>DB.billing.filter(b=>b.companyId===c.id&&isOver(b));
const dueAmt=cid=>DB.billing.filter(b=>b.companyId===cid&&b.status==='due').reduce((s,b)=>s+b.amount,0);
function blockInfo(c){
  if(c.status==='pending')return{k:'pending'};
  if(c.status==='rejected')return{k:'rejected'};
  if(c.status==='suspended')return{k:'suspended'};
  const o=overdueBills(c);if(o.length)return{k:'overdue',bills:o};
  return null;
}
const billBadge=b=>b.status==='paid'?'<span class="badge st-full">Paid</span>':isOver(b)?'<span class="badge st-suspended">Overdue</span>':'<span class="badge st-trial">Due</span>';
function payBill(id){
  const b=DB.billing.find(x=>x.id===id);if(!b||b.status==='paid')return;
  b.status='paid';b.paidAt=Date.now();
  const c=cById(b.companyId);
  if(b.monthly&&c&&c.nextDue===b.dueDate)c.nextDue=addMonths(c.nextDue,1);
  sLog(b.companyId,'Bill marked paid',b.no+' · '+money(b.amount));
  save();
}

  const cid=uid(),now=Date.now(),pd=PLAN_DEF[status]||PLAN_DEF.trial;

function postings(){
  const cid=CID(),out=[];
  DB.entries.forEach(e=>{if(e.companyId!==cid)return;const isR=e.kind==='receipt',tot=entTotal(e),vt=isR?'Receipt':'Payment';
    const memo=e.rows.map(r=>headName(r.head)+(r.party?' ('+partyName(r.party)+')':'')).join(', ');
    out.push({date:e.date,no:e.no,vtype:vt,kind:e.kind,head:e.account,party:'',slip:'',cc:{},dr:isR?tot:0,cr:isR?0:tot,memo,eid:e.id});
    e.rows.forEach(r=>{const a=num(r.amount);out.push({date:e.date,no:e.no,vtype:vt,kind:e.kind,head:r.head,party:r.party||'',slip:r.slip||'',cc:r.cc||{},dr:isR?0:a,cr:isR?a:0,memo:headName(e.account),eid:e.id})})});
  DB.vouchers.forEach(v=>{if(v.companyId!==cid)return;v.rows.forEach(l=>out.push({date:v.date,no:v.no,vtype:v.type,kind:'voucher',head:l.head,party:l.party||'',slip:l.slip||'',cc:l.cc||{},dr:num(l.dr),cr:num(l.cr),memo:'',eid:v.id}))});
  tradeAllPosts().forEach(p=>out.push(p));
  return out.sort((a,b)=>a.date.localeCompare(b.date)||a.no.localeCompare(b.no));
}
const sumP=(a,f)=>a.reduce((s,p)=>s+f(p),0);
function headTotals(posts,to){const m={};posts.forEach(p=>{if(to&&p.date>to)return;const x=m[p.head]=m[p.head]||{dr:0,cr:0};x.dr+=p.dr;x.cr+=p.cr});return m}
function partyBalMap(posts){const m={};mine('parties').forEach(p=>m[p.id]=num(p.opening));posts.forEach(p=>{if(p.party&&p.party in m)m[p.party]+=p.dr-p.cr});return m}
function plCalc(posts,from,to){const inc={},exp={};posts.forEach(p=>{if((from&&p.date<from)||(to&&p.date>to))return;const t=typeOf(p.head);if(t==='Income')inc[p.head]=(inc[p.head]||0)+p.cr-p.dr;else if(t==='Expense')exp[p.head]=(exp[p.head]||0)+p.dr-p.cr});const si=Object.values(inc).reduce((a,b)=>a+b,0),se=Object.values(exp).reduce((a,b)=>a+b,0);return{inc,exp,income:si,expense:se,net:si-se}}
const firstDate=()=>{const p=postings();return p.length?p[0].date:today()};

/* Reset mail is sent through EmailJS (https://www.emailjs.com). Fill these 3 values once and password reset by email will work. */
const MAIL={serviceId:'',templateId:'',publicKey:''};
function genPass(){const ch='ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789',a=new Uint32Array(10);crypto.getRandomValues(a);return Array.from(a,n=>ch[n%ch.length]).join('')}
async function sendResetMail(to,name,np){
  if(!MAIL.serviceId||!MAIL.templateId||!MAIL.publicKey)throw new Error('nomail');
  const r=await fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service_id:MAIL.serviceId,template_id:MAIL.templateId,user_id:MAIL.publicKey,template_params:{to_email:to,to_name:name,new_password:np,app_name:'BIZBOOK'}})});
  if(!r.ok)throw new Error('send');
}
A.doForgot=async(d,el)=>{
  const email=V('fp_email').toLowerCase();
  if(!email)return toast('Please enter your email.','err');
  if(!isEmail(email))return toast('Please enter a valid email address.','err');
  const fus=DB.users.filter(x=>x.email.toLowerCase()===email);
  if(!fus.length)return toast('This email is not registered.','err');
  const np=genPass();
  if(el)el.disabled=true;
  try{await sendResetMail(email,fus[0].name,np)}
  catch(e){if(el)el.disabled=false;return toast(e.message==='nomail'?'Email service is not set up yet. Please contact BIZEASE Solutions.':'Email could not be sent. Check your internet and try again.','err')}
  fus.forEach(u=>{u.pass=pw(np)});save();toast('A new password has been sent to your email.');go('login');
};
A.pwToggle=(d,el)=>{const i=el.parentElement.querySelector('input');if(!i)return;const show=i.type==='password';i.type=show?'text':'password';el.innerHTML=show?EYE_OFF:EYE_ON;el.setAttribute('aria-label',show?'Hide password':'Show password')};

/* ---------- dashboard ---------- */
const DAYN=['Su','Mo','Tu','We','Th','Fr','Sa'];
function pageHome(){
  const c=co(),u=me(),fin=can('dash'),t=today(),ents=mine('entries');
  const quick=(can('receipt')||can('payment'))?`<div class="qa">${can('receipt')?`<a class="btn" href="#/receipt">${ic('in',20)}Receive money</a>`:''}${can('payment')?`<a class="btn tan" href="#/payment">${ic('out',20)}Pay money</a>`:''}</div>`:'';
  const recent=ents.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.at-a.at).slice(0,6);
  const recentHtml=`<div class="card"><h3>Recent entries</h3>${recent.length?recent.map(e=>`<div class="item"><div class="l"><b>${esc(e.no)} · ${esc(e.rows.map(r=>headName(r.head)).join(', '))}</b><span class="mut sm">${dmy(e.date)} · ${esc(headName(e.account))}</span></div><div class="rt b ${e.kind==='receipt'?'pos':'neg'}">${e.kind==='receipt'?'+':'-'}${fmt(entTotal(e))}</div></div>`).join(''):'<div class="empty small">No entries yet. Tap “Receive money” or “Pay money” to start.</div>'}</div>`;
  if(!fin)return `<div class="ph"><h1>Welcome</h1><p>${esc(c.name)}</p></div>${quick}${recentHtml}`;
  const posts=postings(),tot=headTotals(posts);
  const accs=bankHeads().map(h=>{const x=tot[h.id]||{dr:0,cr:0};return{h,b:x.dr-x.cr}});
  const cash=accs.reduce((s,a)=>s+a.b,0);
  const rToday=ents.filter(e=>e.kind==='receipt'&&e.date===t).reduce((s,e)=>s+entTotal(e),0);
  const pToday=ents.filter(e=>e.kind==='payment'&&e.date===t).reduce((s,e)=>s+entTotal(e),0);
  const pl=plCalc(posts,monthStart(),t);
  const pb=partyBalMap(posts);let ar=0,ap=0;Object.values(pb).forEach(v=>{if(v>0)ar+=v;else ap+=-v});
  const days=[];for(let i=6;i>=0;i--){const d=addDays(t,-i);days.push({d,r:ents.filter(e=>e.kind==='receipt'&&e.date===d).reduce((s,e)=>s+entTotal(e),0),p:ents.filter(e=>e.kind==='payment'&&e.date===d).reduce((s,e)=>s+entTotal(e),0)})}
  const mx=Math.max(1,...days.map(x=>Math.max(x.r,x.p)));
  const tstat=(hasMod('trade')&&can('r-stock'))?(()=>{const L=stockLedger(mine('trades'));let v=0,low=0;mine('items').forEach(i=>{const x=L.stock[i.id]||{qty:0,value:0};v+=x.value;if(num(i.min)>0&&x.qty<=num(i.min))low++});return `<div class="stat"><div class="k">Stock value</div><div class="v">${fmt(v)}</div></div><div class="stat"><div class="k">Low-stock items</div><div class="v ${low?'neg':''}">${low}</div></div>`})():'';
  return `<div class="hero"><div class="k">Money in hand (receipt / payment accounts)</div><div class="big">${money(cash)}</div><div class="chips">${accs.map(a=>`<div class="chip">${esc(a.h.head)}<b>${fmt(a.b)}</b></div>`).join('')||'<div class="chip">Add accounts in Settings</div>'}</div></div>
  ${quick}
  <div class="stats"><div class="stat"><div class="k">Received today</div><div class="v pos">${fmt(rToday)}</div></div><div class="stat"><div class="k">Paid today</div><div class="v neg">${fmt(pToday)}</div></div><div class="stat"><div class="k">Profit this month</div><div class="v ${pl.net<0?'neg':''}">${fmt(pl.net)}</div></div><div class="stat"><div class="k">To collect / to pay</div><div class="v" style="font-size:17px">${fmt(ar)} / ${fmt(ap)}</div></div>${tstat}</div>
  <div class="dgrid two"><div class="card"><div class="row sb"><h3>Last 7 days</h3><div class="leg"><span><i style="background:var(--g7)"></i>In</span><span><i style="background:var(--b4)"></i>Out</span></div></div><div class="bars">${days.map(x=>`<div class="bcol"><div class="bp"><i class="br" style="height:${x.r/mx*100}%"></i><i class="bq" style="height:${x.p/mx*100}%"></i></div><span>${DAYN[new Date(x.d+'T00:00:00').getDay()]}</span></div>`).join('')}</div></div>
  ${recentHtml}</div>`;
}

function pickLogo(inp){
  const f=inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,200/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);LOGO_TMP=cv.toDataURL('image/png');$('#logoPrev').innerHTML=`<img src="${LOGO_TMP}" width="56" height="56" style="border-radius:10px;object-fit:cover" alt="">`};im.src=rd.result};
  rd.readAsDataURL(f);
}

  confirmBox('Delete account “'+esc(headName(d.id))+'”?',()=>{logAct('Account deleted',headName(d.id));DB.coa=DB.coa.filter(h=>h.id!==d.id);save();render()});

A.coaTpl=()=>download('chart-of-account-template.csv',toCSV([['Account head','Main type'],['Sales','Income'],['Shop rent','Expense'],['Cash','Cash'],['UBL Bank','Bank'],['Laptop','Asset'],['Loan','Liability'],['Owner capital','Equity']]),'text/csv',true);
function loadSheetJS(){return new Promise((ok,no)=>{if(window.XLSX)return ok();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('offline'));document.head.append(s)})}
async function coaImport(inp){
  const f=inp.files[0];if(!f)return;
  try{
    let rows;
    if(/\.csv$/i.test(f.name))rows=parseCSV(await f.text());
    else{await loadSheetJS();const wb=XLSX.read(await f.arrayBuffer());rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}
    let add=0,skip=0;
    rows.forEach((r,i)=>{const h=String(r[0]||'').trim(),t0=String(r[1]||'').trim();if(!h)return;if(i===0&&/account|head/i.test(h)&&/type/i.test(t0))return;
      const t=TYPES.find(x=>x.toLowerCase()===t0.toLowerCase());
      if(!t||mine('coa').some(x=>x.head.toLowerCase()===h.toLowerCase())){skip++;return}
      DB.coa.push({id:uid(),companyId:CID(),head:h,type:t});add++});
    if(add)logAct('Accounts imported',add+' account(s)');save();toast(`${add} account(s) added${skip?', '+skip+' skipped (duplicate or unknown type)':''}.`,add?'':'err');render();
  }catch(e){toast('Could not read this file. Excel needs internet once; CSV works offline.','err')}
}

/* ================= BACKDATE LOCK + NO-NEGATIVE CASH/BANK ================= */
const lockDate=()=>co().lockDate||'';
const isLocked=d=>!!(lockDate()&&d&&d<=lockDate());
const lockMsg=()=>'Entries dated on or before '+dmy(lockDate())+' are locked. Nothing can be added, edited or deleted on those dates.';
const isCashHead=id=>{const h=headById(id);return !!h&&(h.type==='Cash'||h.type==='Bank'||co().cashHeads.includes(id))};
const entSim=(kind,date,account,rows)=>{const R=kind==='receipt',tot=rows.reduce((a,r)=>a+num(r.amount),0),o=[{date,head:account,dr:R?tot:0,cr:R?0:tot}];rows.forEach(r=>{const a=num(r.amount);o.push({date,head:r.head,dr:R?0:a,cr:R?a:0})});return o};
const vSim=(date,rows)=>rows.map(l=>({date,head:l.head,dr:num(l.dr),cr:num(l.cr)}));
/* returns an error text if the change would push a cash/bank account below zero (and makes it worse than before) */
function negCheck(add,excludeId){
  const all=postings(),base=all.filter(p=>p.eid!==excludeId),gone=all.filter(p=>p.eid===excludeId);
  const heads=[...new Set([...add,...gone].map(p=>p.head))].filter(isCashHead);
  const walk=(list,from)=>{const m={};list.filter(p=>p.date>=from).forEach(p=>{m[p.date]=(m[p.date]||0)+p.dr-p.cr});let run=0,min=Infinity,at='';const pre=list.filter(p=>p.date<from).reduce((a,p)=>a+p.dr-p.cr,0);run=pre;Object.keys(m).sort().forEach(d=>{run+=m[d];if(d>=from&&run<min){min=run;at=d}});if(min===Infinity){min=run;at=from}return{min:r2(min),at}};
  for(const h of heads){
    const A=add.filter(p=>p.head===h),G=gone.filter(p=>p.head===h),dates=[...A,...G].map(p=>p.date).sort(),from=dates[0];
    const b=base.filter(p=>p.head===h),before=walk(b.concat(G),from),after=walk(b.concat(A),from);
    if(after.min<-0.005&&after.min<before.min-0.005){
      const avail=r2(b.filter(p=>p.date<=after.at).reduce((a,p)=>a+p.dr-p.cr,0));
      return '“'+headName(h)+'” does not have enough balance. Balance on '+dmy(after.at)+' would become '+fmt(after.min)+'. Available before this entry: '+money(Math.max(0,avail))+'.';
    }
  }
  return '';
}

A.saveEntry=d=>{
  const k=d.k,dr=getDraft(k);
  if(!dr.account)return toast('Add a '+(k==='receipt'?'receipt':'payment')+' account in setup first.','err');
  if(!dr.date)return toast('Choose a date.','err');
  const rows=dr.rows.filter(r=>r.head||r.amount||r.party||r.slip);
  if(!rows.length)return toast('Add at least one line.','err');
  for(const r of rows){if(!r.head)return toast('Choose an account head on every line.','err');if(num(r.amount)<=0)return toast('Enter an amount greater than zero on every line.','err')}
  const clean=rows.map(r=>({head:r.head,party:r.party,slip:r.slip.trim(),cc:cleanCC(r.cc),amount:r2(num(r.amount))}));
  if(isLocked(dr.date))return toast(lockMsg(),'err');
  if(dr.id){const o=DB.entries.find(x=>x.id===dr.id);if(o&&isLocked(o.date))return toast(lockMsg(),'err')}

function tCalc(t){
  const sub=r2(sumP(t.rows,lineNet)),disc=Math.min(r2(num(t.disc)),sub),taxable=r2(sub-disc),tax=r2(taxable*Math.min(100,Math.max(0,num(t.taxp)))/100),charges=r2(num(t.charges)),total=r2(taxable+tax+charges),paid=r2(num(t.paid));
  return{sub,disc,taxable,tax,charges,total,paid,due:r2(total-paid)};
}
/* the accounts the module posts to are created once per company */
function ensureTradeHeads(c){
  c.sys=c.sys||{};
  [['ar','Accounts receivable','Asset'],['ap','Accounts payable','Liability'],['cogs','Cost of goods sold','Expense'],['tax','Sales tax','Liability'],['sales','Sales','Income'],['other','Other income','Income'],['inv','Stock / inventory','Asset'],['cap','Owner capital','Equity']].forEach(([k,n,t])=>{
    if(c.sys[k]&&DB.coa.some(h=>h.id===c.sys[k]))return;
    let h=DB.coa.find(x=>x.companyId===c.id&&x.head.toLowerCase()===n.toLowerCase());
    if(!h){h={id:uid(),companyId:c.id,head:n,type:t};DB.coa.push(h)}
    c.sys[k]=h.id;
  });
  save();
}
/* stock ledger: weighted-average cost, processed by date (stock-in first on the same day) */
function stockLedger(trs,upto){
  const items={};mine('items').forEach(i=>items[i.id]=i);
  const ev=[];
  Object.values(items).forEach(i=>{if(num(i.openQty)>0)ev.push({d:i.openDate||'0000-00-00',o:0,at:0,op:i})});
  (trs||[]).forEach(t=>ev.push({d:t.date,o:(t.kind==='purchase'||t.kind==='salereturn')?1:2,at:t.at||0,t}));
  ev.sort((a,b)=>a.d.localeCompare(b.d)||a.o-b.o||a.at-b.at);
  const st={},costs={},landed={},moves=[],neg=[],S=id=>st[id]||(st[id]={qty:0,value:0});
  ev.forEach(e=>{
    if(upto&&e.d>upto)return;
    if(e.op){const i=e.op,s=S(i.id),q=q3(num(i.openQty)),v=r2(q*num(i.openRate));s.qty=q3(s.qty+q);s.value=r2(s.value+v);moves.push({item:i.id,date:e.d,no:'OPENING',type:'Opening stock',party:'',inq:q,outq:0,rate:num(i.openRate),bal:s.qty});return}
    const t=e.t,k=t.kind,tot=tCalc(t),n=t.rows.length;
    const share=amt=>{let used=0;return t.rows.map((r,ix)=>{const x=ix===n-1?r2(amt-used):(tot.sub>0?r2(amt*lineNet(r)/tot.sub):0);used=r2(used+x);return x})};
    const dS=share(tot.disc),cS=share(tot.charges);
    costs[t.id]=[];landed[t.id]=[];
    t.rows.forEach((r,ix)=>{
      const s=S(r.item),q=q3(num(r.qty)),ln=lineNet(r),it=items[r.item]||{};
      const avg=s.qty>0?s.value/s.qty:num(it.buy);
      let cost=0,inq=0,outq=0;
      if(k==='purchase'){cost=r2(ln-dS[ix]+cS[ix]);landed[t.id][ix]=cost;s.qty=q3(s.qty+q);s.value=r2(s.value+cost);inq=q}
      else if(k==='salereturn'){cost=r2(q*avg);s.qty=q3(s.qty+q);s.value=r2(s.value+cost);inq=q}
      else{cost=(q>=s.qty&&s.qty>0)?s.value:r2(q*avg);s.qty=q3(s.qty-q);s.value=r2(s.value-cost);outq=q}
      if(s.qty===0&&Math.abs(s.value)<0.01)s.value=0;
      if(s.qty<0)neg.push({item:r.item,date:t.date,no:t.no,qty:s.qty});
      costs[t.id][ix]=cost;
      moves.push({item:r.item,date:t.date,no:t.no,type:TK[k].v,party:partyName(t.party),inq,outq,rate:num(r.rate),bal:s.qty});
    });
  });
  return{stock:st,costs,landed,moves,neg};
}
/* ledger postings of one invoice (double entry, always balanced) */
function tradePosts(t,costs){
  const S=co().sys,k=t.kind,tot=tCalc(t),out=[],ps=partyName(t.party),memo=TK[k].v+(ps?' · '+ps:'');
  const C=r2(sumP(costs||[],x=>x));
  const P=(head,dr,cr,party)=>{dr=r2(dr);cr=r2(cr);if(dr||cr)out.push({date:t.date,no:t.no,vtype:TK[k].v,kind:'trade',head,party:party||'',slip:'',cc:{},dr,cr,memo,eid:t.id})};
  if(k==='sale'){P(t.account,tot.paid,0);P(S.ar,tot.due,0,t.party);P(S.sales,0,tot.taxable);P(S.tax,0,tot.tax);P(S.other,0,tot.charges);P(S.cogs,C,0);P(S.inv,0,C)}
  else if(k==='salereturn'){P(t.account,0,tot.paid);P(S.ar,0,tot.due,t.party);P(S.sales,tot.taxable,0);P(S.tax,tot.tax,0);P(S.other,tot.charges,0);P(S.inv,C,0);P(S.cogs,0,C)}
  else if(k==='purchase'){P(S.inv,tot.taxable+tot.charges,0);P(S.tax,tot.tax,0);P(t.account,0,tot.paid);P(S.ap,0,tot.due,t.party)}
  else{const diff=r2(tot.taxable+tot.charges-C);P(t.account,tot.paid,0);P(S.ap,tot.due,0,t.party);P(S.inv,0,C);P(S.tax,0,tot.tax);if(diff>0)P(S.cogs,0,diff);else P(S.cogs,-diff,0)}
  return out;
}
function tradeAllPosts(){
  const c=co(),out=[];if(!c||!c.sys||!c.sys.inv)return out;
  const trs=mine('trades'),L=stockLedger(trs);
  trs.forEach(t=>tradePosts(t,L.costs[t.id]).forEach(p=>out.push(p)));
  mine('items').forEach(i=>{const v=r2(num(i.openQty)*num(i.openRate));if(v>0&&i.openPost!==false){
    const b={date:i.openDate,no:'OS-'+(i.code||''),vtype:'Opening stock',kind:'trade',party:'',slip:'',cc:{},memo:'Opening stock · '+i.name,eid:i.id};
    out.push({...b,head:c.sys.inv,dr:v,cr:0},{...b,head:c.sys.cap,dr:0,cr:v})}});
  return out;
}
/* a sale / purchase may not push stock below zero (unless allowed in Items setup) */
function stockProblem(newT,oldId){
  const c=co();if(c.negStock)return '';
  const list=mine('trades').filter(t=>t.id!==oldId);if(newT)list.push(newT);
  const old=oldId?DB.trades.find(t=>t.id===oldId):null;
  const touched=new Set([...(newT?newT.rows:[]),...(old?old.rows:[])].map(r=>r.item));
  const b=stockLedger(list).neg.find(x=>touched.has(x.item));
  return b?'Not enough stock of “'+itemName(b.item)+'” on '+dmy(b.date)+' (short by '+fq(-b.qty)+' '+itemUnit(b.item)+'). Add a purchase or opening stock first.':'';
}

A.tSave=d=>{
  const k=d.k,dr=getTD(k),rows=dr.rows.filter(r=>r.item||num(r.qty)||num(r.rate));
  if(!dr.date)return toast('Choose a date.','err');
  if(!rows.length)return toast('Add at least one item line.','err');
  for(const r of rows){if(!r.item)return toast('Choose an item on every line.','err');if(num(r.qty)<=0)return toast('Enter a quantity greater than zero on every line.','err');if(r.rate===''||num(r.rate)<0)return toast('Enter a rate on every line.','err');if(num(r.disc)<0||num(r.disc)>100)return toast('Line discount must be between 0 and 100%.','err')}
  const clean=rows.map(r=>({item:r.item,qty:q3(num(r.qty)),rate:r2(num(r.rate)),disc:num(r.disc)}));
  const t={id:dr.id||uid(),companyId:CID(),kind:k,no:dr.no,date:dr.date,party:dr.party,account:dr.account,rows:clean,disc:r2(num(dr.disc)),taxp:num(dr.taxp),charges:r2(num(dr.charges)),paid:r2(num(dr.paid)),note:(dr.note||'').trim(),by:me().id,at:Date.now()};
  if(t.taxp<0||t.taxp>100)return toast('Tax % must be between 0 and 100.','err');
  const c=tCalc(t);
  if(t.disc>c.sub+0.004)return toast('Discount cannot be more than the subtotal.','err');
  if(t.charges<0||t.disc<0)return toast('Discount and charges cannot be negative.','err');
  if(c.total<=0)return toast('Invoice total must be more than zero.','err');
  if(t.paid<0||t.paid>c.total+0.004)return toast('The amount cannot be more than the invoice total.','err');
  if(c.due>0.004&&!t.party)return toast('Choose a '+(isSale(k)?'customer':'supplier')+' for the unpaid balance, or take the full amount.','err');
  if(t.paid>0&&!t.account)return toast('Add a '+(tAcc(k)==='receipt'?'receipt':'payment')+' account in setup first.','err');
  if(isLocked(t.date))return toast(lockMsg(),'err');
  let old=null;
  if(dr.id){old=DB.trades.find(x=>x.id===dr.id);if(!old)return;if(isLocked(old.date))return toast(lockMsg(),'err');t.no=old.no;t.at=old.at;t.by=old.by}
  const sp=stockProblem(t,dr.id||'');if(sp)return toast(sp,'err');
  const inn=(k==='sale'||k==='purchasereturn'),ng=negCheck(t.paid>0?[{date:t.date,head:t.account,dr:inn?t.paid:0,cr:inn?0:t.paid}]:[],dr.id||'');if(ng)return toast(ng,'err');
  if(!old)t.no=nextNo(TK[k].pre);
  if(old)DB.trades[DB.trades.indexOf(old)]=t;else DB.trades.push(t);
  logAct(TK[k].t+(old?' edited':' added'),t.no+' · '+money(c.total));
  save();delete TDRAFT[k];toast(TK[k].t+' saved: '+t.no);render();
};

  TDRAFT[t.kind]={id:t.id,no:t.no,kind:t.kind,date:t.date,party:t.party||'',account:t.account||'',rows:t.rows.map(r=>({item:r.item,qty:String(r.qty),rate:String(r.rate),disc:r.disc?String(r.disc):''})),disc:t.disc?String(t.disc):'',taxp:t.taxp?String(t.taxp):'',charges:t.charges?String(t.charges):'',paid:String(t.paid),paidAuto:false,note:t.note||''};

/* ---------- STOCK / SALE-PURCHASE / ITEM LEDGER REPORTS ---------- */
function stockData(){
  const L=stockLedger(mine('trades'),R.to);
  return mine('items').filter(i=>inSel('item',i.id)).sort((a,b)=>a.name.localeCompare(b.name)).map(i=>{const s=L.stock[i.id]||{qty:0,value:0};return{i,qty:s.qty,value:s.value,avg:s.qty>0?s.value/s.qty:0}}).filter(r=>r.qty||r.value||num(r.i.openQty));
}
function stockHtml(){
  const rows=stockData(),tv=sumP(rows,r=>r.value);
  return repHead('Stock report','As at '+dmy(R.to)+' · '+esc(msLabel('item')))+(rows.length?`<div class="tw"><table class="tbl"><thead><tr><th>Item</th><th>Category</th><th>Unit</th><th class="r">Qty</th><th class="r">Avg cost</th><th class="r">Stock value</th><th class="r">Sale price</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.i.name)}<div class="mut sm">${esc(r.i.code)}</div></td><td>${esc(r.i.category)}</td><td>${esc(r.i.unit)}</td><td class="r ${r.qty<0||(num(r.i.min)>0&&r.qty<=num(r.i.min))?'neg':''}">${fq(r.qty)}</td><td class="r">${fmt(r.avg)}</td><td class="r">${fmt(r.value)}</td><td class="r">${fmt(num(r.i.sell))}</td></tr>`).join('')}<tr class="tot"><td colspan="5">Total stock value</td><td class="r">${fmt(tv)}</td><td></td></tr></tbody></table></div><p class="mut sm">Red quantity = below the low-stock alert (or negative).</p>`:'<div class="empty small">No stock found.</div>');
}
function stockCSV(){const rows=[['Code','Item','Category','Unit','Qty','Avg cost','Stock value','Sale price','Min stock','As at']];stockData().forEach(r=>rows.push([r.i.code,r.i.name,r.i.category,r.i.unit,r.qty,r.avg?r2(r.avg):'',r.value,r.i.sell,r.i.min||'',R.to]));download('stock-report.csv',toCSV(rows),'text/csv',true)}
P['r-stock']={f:()=>{rInit();return repPage('Stock report',`${dateF('As at date','to')}${msBtn('item','Items')}`,stockHtml,stockCSV)},mod:'trade',perm:'r-stock'};

const TKSEL=[['S','Sales (sale − returns)'],['P','Purchases (purchase − returns)'],['sale','Sale invoices only'],['salereturn','Sale returns only'],['purchase','Purchase invoices only'],['purchasereturn','Purchase returns only']];
const kindOK=(k,f)=>f==='S'?isSale(k):f==='P'?!isSale(k):k===f;
function tradeRepData(){
  const trs=mine('trades').filter(t=>t.date>=R.from&&t.date<=R.to&&kindOK(t.kind,R.tk)&&inSel('party',t.party)).sort((a,b)=>a.date.localeCompare(b.date)||a.no.localeCompare(b.no));
  const L=stockLedger(mine('trades')),inv=trs.map(t=>{const c=tCalc(t),s=TK[t.kind].s;return{t,s,total:c.total*s,paid:c.paid*s,due:c.due*s}});
  const m={};
  trs.forEach(t=>{const s=TK[t.kind].s;t.rows.forEach((r,ix)=>{if(!inSel('item',r.item))return;const x=m[r.item]=m[r.item]||{item:r.item,qty:0,amt:0,cost:0,sale:false};x.qty+=s*num(r.qty);x.amt+=s*lineNet(r);if(isSale(t.kind)){x.sale=true;x.cost+=s*((L.costs[t.id]||[])[ix]||0)}})});
  return{inv,items:Object.values(m).sort((a,b)=>itemName(a.item).localeCompare(itemName(b.item)))};
}
function tradeRepHtml(){
  const d=tradeRepData(),tl=(TKSEL.find(x=>x[0]===R.tk)||[0,''])[1];
  if(R.tv==='item'){
    return repHead('Sale / purchase report · item-wise',esc(tl)+' · '+dmy(R.from)+' to '+dmy(R.to))+(d.items.length?`<div class="tw"><table class="tbl"><thead><tr><th>Item</th><th>Unit</th><th class="r">Qty</th><th class="r">Amount</th><th class="r">Cost</th><th class="r">Profit</th></tr></thead><tbody>${d.items.map(x=>`<tr><td>${esc(itemName(x.item))}</td><td>${esc(itemUnit(x.item))}</td><td class="r">${fq(x.qty)}</td><td class="r">${fmt(x.amt)}</td><td class="r">${x.sale?fmt(x.cost):''}</td><td class="r ${x.amt-x.cost<0?'neg':''}">${x.sale?fmt(x.amt-x.cost):''}</td></tr>`).join('')}<tr class="tot"><td colspan="3">Total</td><td class="r">${fmt(sumP(d.items,x=>x.amt))}</td><td class="r">${fmt(sumP(d.items.filter(x=>x.sale),x=>x.cost))}</td><td class="r">${fmt(sumP(d.items.filter(x=>x.sale),x=>x.amt-x.cost))}</td></tr></tbody></table></div><p class="mut sm">Amounts are line amounts before invoice-level discount, tax and charges. Profit = sale amount − average cost of the goods sold.</p>`:'<div class="empty small">Nothing found in this period.</div>');
  }
  return repHead('Sale / purchase report · invoices',esc(tl)+' · '+dmy(R.from)+' to '+dmy(R.to))+(d.inv.length?`<div class="tw"><table class="tbl"><thead><tr><th>Date</th><th>Invoice</th><th>Type</th><th>Party</th><th class="r">Total</th><th class="r">Paid / received</th><th class="r">Balance</th></tr></thead><tbody>${d.inv.map(x=>`<tr><td>${dmy(x.t.date)}</td><td>${esc(x.t.no)}</td><td>${TK[x.t.kind].v}</td><td>${esc(partyName(x.t.party)||'Cash')}</td><td class="r">${fmt(x.total)}</td><td class="r">${fmt(x.paid)}</td><td class="r">${fmt(x.due)}</td></tr>`).join('')}<tr class="tot"><td colspan="4">Total</td><td class="r">${fmt(sumP(d.inv,x=>x.total))}</td><td class="r">${fmt(sumP(d.inv,x=>x.paid))}</td><td class="r">${fmt(sumP(d.inv,x=>x.due))}</td></tr></tbody></table></div>`:'<div class="empty small">No invoices in this period.</div>');
}
function tradeRepCSV(){
  const d=tradeRepData(),rows=[];
  if(R.tv==='item'){rows.push(['Item code','Item','Category','Unit','Qty','Amount','Cost','Profit','From','To']);d.items.forEach(x=>{const it=itemById(x.item)||{};rows.push([it.code||'',it.name||'',it.category||'',it.unit||'',x.qty,x.amt,x.sale?x.cost:'',x.sale?r2(x.amt-x.cost):'',R.from,R.to])})}
  else{rows.push(['Date','Month','Invoice #','Type','Party','Party type','Total','Paid / received','Balance']);d.inv.forEach(x=>rows.push([x.t.date,monthOf(x.t.date),x.t.no,TK[x.t.kind].v,partyName(x.t.party),partyType(x.t.party),x.total,x.paid,x.due]))}
  download('sale-purchase-report.csv',toCSV(rows),'text/csv',true);
}

const tkSort=(a,b)=>(a.status==='closed')-(b.status==='closed')||b.upd-a.upd;

let TKF='open';

function tkDash(){const l=DB.tickets.filter(t=>t.status==='open').sort((a,b)=>b.upd-a.upd).slice(0,6);return l.length?l.map(t=>tkRow(t,true)).join(''):'<div class="empty small">No tickets waiting for a reply.</div>'}

const LF={u:'',from:'',to:'',q:''};
function logRows(cid,f){f=f||{};const q=(f.q||'').toLowerCase();const hide=new Set(['super']);/* super admin activity is never shown to anyone */
  if(!isSuper()){const vu=me();if(vu&&vu.role!=='owner')DB.users.forEach(x=>{if(x.companyId===cid&&x.role==='owner')hide.add(x.id)})}/* admin activity is not shown on the user side */
  return DB.logs.filter(l=>l.companyId===cid&&!hide.has(l.userId)&&(!f.u||l.userId===f.u)&&(!f.from||ymd(new Date(l.at))>=f.from)&&(!f.to||ymd(new Date(l.at))<=f.to)&&(!q||(l.name+' '+l.action+' '+l.detail).toLowerCase().includes(q))).sort((a,b)=>b.at-a.at)}
function logTable(rows,max){
  if(!rows.length)return '<div class="empty small">No activity found.</div>';
  const shown=rows.slice(0,max||200);
  return `<div class="tw"><table class="tbl"><thead><tr><th>Date &amp; time</th><th>User</th><th>Action</th><th>Details</th></tr></thead><tbody>${shown.map(l=>`<tr><td style="white-space:nowrap">${dts(l.at)}</td><td>${esc(l.name)}</td><td><b>${esc(l.action)}</b></td><td>${esc(l.detail)}</td></tr>`).join('')}</tbody></table></div>${rows.length>shown.length?`<p class="mut sm">Showing latest ${shown.length} of ${rows.length}. Narrow the filters or export to Excel.</p>`:''}`;
}
const logRefresh=()=>{$('#logout').innerHTML=logTable(logRows(CID(),LF))};

/* --- plan & limits modal (also used for approvals) --- */
function plPreset(){const p=PLAN_DEF[V('pl_st')];if(!p)return;$('#pl_users').value=p.users;$$('.pmod').forEach(b=>b.checked=p.mods.includes(b.dataset.m))}
function planModal(cid,rid){
  const c=cById(cid),rq=rid?DB.requests.find(x=>x.id===rid):null,d=rq&&rq.type==='plan'?rq.data:null;
  const st0=d?d.plan:(['pending','rejected','suspended'].includes(c.status)?'trial':c.status),mods=d?d.mods:c.modules,users=d?d.users:c.maxUsers;
  modal(`<h3>Plan &amp; limits · ${esc(c.name)}</h3>${d?`<div class="banner info"><div><b>User asked for:</b> ${ST[d.plan]} · ${d.users} user(s) · ${d.mods.length?esc(d.mods.map(m=>(MODS.find(x=>x[0]===m)||[0,m])[1]).join(', ')):'basic modules'}${d.note?'<br>Note: '+esc(d.note):''}</div></div>`:''}
  ${SEL('pl_st','Plan / status',opts(PLANS.map(p=>[p,ST[p]]),st0),'onchange="plPreset()"')}${F('pl_users','Maximum users',{type:'number',v:users,attr:'min="1"'})}
  <div class="lbl">Modules allowed</div>${MODS.map(m=>`<label class="chk"><input type="checkbox" class="pmod" data-m="${m[0]}" ${mods.includes(m[0])?'checked':''}>${m[1]}</label>`).join('')}
  <div class="g2 rs" style="margin-top:8px">${F('pl_fee','Monthly fee (Rs)',{type:'number',v:c.fee||'',attr:'min="0" inputmode="decimal"'})}${F('pl_due','First / next due date',{type:'date',v:c.nextDue||addDays(today(),30)})}</div>
  ${F('pl_days','Trial days (used when starting a trial)',{type:'number',v:TRIAL_DAYS,attr:'min="1"'})}
  <label class="chk"><input type="checkbox" id="pl_bill" checked>Generate the bill now (paid plans with a monthly fee)</label>
  <p class="mut sm">Paid plans: the next bill is created automatically ${BILL_ADVANCE} days before each due date. The account is blocked if a bill is unpaid after its due date.</p>
  <div class="row end"><button class="btn ghost s" data-a="closeModal">Cancel</button><button class="btn s" data-a="plSave" data-id="${cid}" data-rid="${rid||''}">${rid||c.status==='pending'?'Approve &amp; save':'Save'}</button></div>`);
}
A.sApprove=d=>planModal(d.id);
A.sPlan=d=>planModal(d.id);
A.plSave=d=>{
  const c=cById(d.id),prev=c.status,st=V('pl_st'),users=Math.max(1,Math.floor(num(V('pl_users')))),mods=$$('.pmod').filter(b=>b.checked).map(b=>b.dataset.m),fee=Math.max(0,num(V('pl_fee'))),due=V('pl_due');
  if(st!=='trial'&&fee>0&&!due)return toast('Choose the due date.','err');
  c.status=st;c.autoSuspended=false;c.maxUsers=users;c.modules=mods;c.fee=fee;c.nextDue=st==='trial'?'':(due||'');
  if(st==='trial'&&prev!=='trial')c.trialEnds=Date.now()+Math.max(1,num(V('pl_days')))*864e5;
  if(st!=='trial'&&fee>0&&c.nextDue&&$('#pl_bill').checked&&!DB.billing.some(b=>b.companyId===c.id&&b.monthly&&b.dueDate===c.nextDue))DB.billing.push(mkBill(c.id,fee,c.nextDue,'Monthly plan fee ('+ST[st]+')',true,false));
  if(d.rid){const rq=DB.requests.find(x=>x.id===d.rid);if(rq){rq.status='approved';rq.resolvedAt=Date.now()}}
  sLog(c.id,prev==='pending'?'Company approved':'Plan changed',ST[st]+' · '+users+' user(s) · fee '+fee);
  save();closeModal();toast(c.name+': '+ST[st]);render();
};
A.sBlock=d=>{const c=cById(d.id);confirmBox('Block <b>'+esc(c.name)+'</b>? Their users can log in but will only see a “blocked” message.',()=>{c.status='suspended';c.autoSuspended=false;sLog(c.id,'Company blocked','');save();toast('Company blocked.');render()},'Block')};
A.sEdit=d=>{const c=cById(d.id),ow=DB.users.find(u=>u.companyId===c.id&&u.role==='owner')||{};
  modal(`<h3>Edit company</h3>${F('se_co','Company name',{v:c.name})}${F('se_name','Owner full name',{v:c.owner})}${F('se_cell','Cell',{v:c.cell,type:'tel'})}${F('se_city','City',{v:c.city})}${SEL('se_biz','Business type',opts(BIZ,c.biz))}${F('se_email','Login ID',{v:ow.email})}${F('se_pass','Reset owner password (optional)',{type:'password'})}<div class="row end"><button class="btn ghost s" data-a="closeModal">Cancel</button><button class="btn s" data-a="sSave" data-id="${c.id}">Save changes</button></div>`)};
A.sSave=d=>{
  const c=cById(d.id),ow=DB.users.find(u=>u.companyId===c.id&&u.role==='owner'),n=V('se_co'),em=V('se_email').toLowerCase();
  if(!n||!em)return toast('Company name and login ID are required.','err');
  if(DB.companies.some(x=>x.id!==c.id&&x.name.toLowerCase()===n.toLowerCase()))return toast('Another company has this name.','err');
  if(em===DB.super.email.toLowerCase()||DB.users.some(u=>u!==ow&&u.companyId===ow.companyId&&u.email.toLowerCase()===em))return toast('This login ID is already taken.','err');
  const np=$('#se_pass').value;if(np&&np.length<4)return toast('Password needs at least 4 characters.','err');
  if(n!==c.name)sLog(c.id,'Company name changed by admin',c.name+' → '+n);
  Object.assign(c,{name:n,owner:V('se_name'),cell:V('se_cell'),city:V('se_city'),biz:V('se_biz')});
  if(ow){ow.email=em;ow.name=V('se_name');ow.cell=V('se_cell');if(np)ow.pass=pw(np)}
  save();closeModal();toast('Company updated.');render();
};
A.sDel=d=>{const c=cById(d.id);confirmBox('Delete <b>'+esc(c.name)+'</b> with all its users and data? This cannot be undone.',()=>{['users','coa','parties','entries','vouchers','costCenters','items','trades','billing','requests','logs','tickets'].forEach(k=>DB[k]=DB[k].filter(x=>x.companyId!==c.id));DB.companies=DB.companies.filter(x=>x.id!==c.id);delete DB.seq[c.id];save();toast('Company deleted.');go('s-companies')})};
A.sAdd=()=>modal(`<h3>Add company</h3>${F('sn_name','Owner full name')}${F('sn_cell','Cell',{type:'tel'})}${F('sn_co','Company name')}${F('sn_city','City')}${SEL('sn_biz','Business type',opts(BIZ,'','Select business type'))}${F('sn_email','Email (this will be the login ID)',{attr:'autocapitalize="none" inputmode="email"'})}${F('sn_pass','Password',{type:'password'})}${SEL('sn_st','Starting plan',opts(PLANS.map(p=>[p,ST[p]]),'trial'))}<p class="mut sm">Set the monthly fee and due date afterwards with “Plan &amp; limits”.</p><div class="row end"><button class="btn ghost s" data-a="closeModal">Cancel</button><button class="btn s" data-a="sAddSave">Create company</button></div>`);
A.sAddSave=()=>{
  const f={name:V('sn_name'),cell:V('sn_cell'),company:V('sn_co'),city:V('sn_city'),biz:V('sn_biz'),email:V('sn_email').toLowerCase(),p:$('#sn_pass').value,st:V('sn_st')};
  if(!f.name||!f.cell||!f.company||!f.city||!f.biz||!f.email||!f.p)return toast('Please fill in every field.','err');
  if(!isEmail(f.email))return toast('Please enter a valid email address.','err');
  if(f.p.length<4)return toast('Password needs at least 4 characters.','err');
  if(f.email===DB.super.email.toLowerCase())return toast('This email is already taken.','err');
  if(DB.companies.some(c=>c.name.toLowerCase()===f.company.toLowerCase()))return toast('This company name is already registered.','err');
  const {c}=mkCompany(f,f.st);sLog(c.id,'Company created by admin',ST[f.st]);save();closeModal();toast('Company created. Share the login ID and password with the shopkeeper.');render();
};

/* --- billing --- */
const BF={st:''};
function billList(){
  let b=DB.billing.slice().sort((a,c)=>c.dueDate.localeCompare(a.dueDate));
  if(BF.st==='due')b=b.filter(x=>x.status==='due'&&!isOver(x));else if(BF.st==='overdue')b=b.filter(isOver);else if(BF.st==='paid')b=b.filter(x=>x.status==='paid');
  return b.length?`<div class="cgrid">${b.map(x=>billCard(x,true)).join('')}</div>`:'<div class="empty small">No bills found.</div>';
}

  const all=DB.billing,unpaid=sumP(all.filter(b=>b.status==='due'),b=>b.amount),over=sumP(all.filter(isOver),b=>b.amount),rec=sumP(all.filter(b=>b.status==='paid'),b=>b.amount);

  <div class="tabs">${[['','All'],['due','Due'],['overdue','Overdue'],['paid','Paid']].map(t=>`<button class="btn s ${BF.st===t[0]?'':'tan'}" data-a="billTab" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>

}

A.saSave=()=>{const em=V('sa_email').toLowerCase();if(!em||!V('sa_name'))return toast('Name and login ID are required.','err');if(DB.users.some(u=>u.email.toLowerCase()===em))return toast('A shop user already uses this login ID.','err');const np=$('#sa_pass').value;if(np&&np.length<6)return toast('Super admin password needs at least 6 characters.','err');DB.super.name=V('sa_name');DB.super.email=em;DB.super.cell=V('sa_cell');if(np)DB.super.pass=pw(np);save();toast('Settings saved.');render()};
A.saExport=()=>download('bizbook-full-backup-'+today()+'.json',JSON.stringify({...DB,session:null}),'application/json');
async function saImport(inp){const f=inp.files[0];if(!f)return;let d;try{d=JSON.parse(await f.text());if(!Array.isArray(d.companies)||!d.super)throw 0}catch(e){inp.value='';return toast('This is not a BizBook full backup.','err')}
  confirmBox('Replace ALL data with this backup? You will stay logged in as super admin.',()=>{DB=d;DB.session={role:'super'};normalize();save();toast('Backup restored.');render()},'Restore');inp.value=''}

/* ---------- searchable dropdowns: every <select> gets a search box ---------- */
(function(){
  const vd=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value');
  Object.defineProperty(HTMLSelectElement.prototype,'value',{configurable:true,get(){return vd.get.call(this)},set(v){vd.set.call(this,v);ssSync(this)}});
  let panel=null,cur=null,hl=0;
  const SIC='<svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+IC.search+'"/></svg>';
  function ssSync(s){
    const b=s._ssb;if(!b)return;
    const o=s.options[s.selectedIndex],t=o?o.textContent:'',sp=b.firstChild;
    if(sp.textContent!==t)sp.textContent=t;
    b.classList.toggle('ph',!s.value);
    if(b.disabled!==s.disabled)b.disabled=s.disabled;
  }
  function ssEnhance(s){
    if(s._ssb||s.multiple||s.size>1)return;
    const b=document.createElement('button');b.type='button';b.className='sel ssb';b.innerHTML='<span></span>'+SIC;
    b.addEventListener('click',()=>{if(s.disabled)return;if(panel&&cur===s){ssClose();return}ssOpen(s,b)});
    s.classList.add('ss-h');s.after(b);s._ssb=b;ssSync(s);
  }
  function ssClose(){if(panel){panel.remove();panel=null;cur=null}}
  function ssPlace(){
    if(!panel||!cur||!cur._ssb)return;
    const r=cur._ssb.getBoundingClientRect(),vh=window.visualViewport?window.visualViewport.height:window.innerHeight;
    const w=Math.max(r.width,Math.min(280,window.innerWidth-16)),left=Math.min(Math.max(8,r.left),window.innerWidth-w-8);
    const below=vh-r.bottom-8,above=r.top-8,up=below<230&&above>below;
    panel.style.width=w+'px';panel.style.left=left+'px';
    panel.style.maxHeight=Math.max(160,Math.min(340,up?above:below))+'px';
    if(up){panel.style.top='';panel.style.bottom=(window.innerHeight-r.top+4)+'px'}else{panel.style.bottom='';panel.style.top=(r.bottom+4)+'px'}
  }
  function ssOpen(s,b){
    ssClose();cur=s;
    panel=document.createElement('div');panel.className='ssp';
    panel.innerHTML='<div class="search">'+ic('search',18)+'<input type="search" placeholder="Type to search…" autocomplete="off"></div><div class="ssl"></div>';
    document.body.append(panel);
    const inp=panel.querySelector('input'),list=panel.querySelector('.ssl');
    const mark=()=>{const xs=list.querySelectorAll('.pk');xs.forEach((e,i)=>e.classList.toggle('hl',i===hl));if(xs[hl])xs[hl].scrollIntoView({block:'nearest'})};
    const draw=()=>{
      const q=inp.value.toLowerCase().trim();let h='';
      Array.from(s.options).forEach((o,i)=>{if(q&&!o.textContent.toLowerCase().includes(q))return;h+=`<button type="button" class="pk${i===s.selectedIndex?' on':''}" data-i="${i}"${o.disabled?' disabled':''}>${esc(o.textContent)||'—'}</button>`});
      list.innerHTML=h||'<div class="empty small">Nothing found.</div>';hl=0;mark();
    };
    const pick=i=>{const o=s.options[i];if(!o||o.disabled)return;const ch=s.selectedIndex!==i;s.selectedIndex=i;ssSync(s);ssClose();if(ch)s.dispatchEvent(new Event('change',{bubbles:true}))};
    list.addEventListener('click',e=>{const x=e.target.closest('.pk');if(x)pick(+x.dataset.i)});
    inp.addEventListener('input',draw);
    inp.addEventListener('keydown',e=>{
      const xs=list.querySelectorAll('.pk');
      if(e.key==='Escape'){e.preventDefault();ssClose()}
      else if(e.key==='ArrowDown'){e.preventDefault();hl=Math.min(xs.length-1,hl+1);mark()}
      else if(e.key==='ArrowUp'){e.preventDefault();hl=Math.max(0,hl-1);mark()}
      else if(e.key==='Enter'){e.preventDefault();if(xs[hl])pick(+xs[hl].dataset.i)}
    });
    draw();ssPlace();
    const sel=list.querySelector('.pk.on');if(sel)sel.scrollIntoView({block:'nearest'});
    setTimeout(()=>{try{inp.focus({preventScroll:true})}catch(e){inp.focus()}},30);
  }
  document.addEventListener('pointerdown',e=>{if(panel&&!panel.contains(e.target)&&!(cur&&cur._ssb&&cur._ssb.contains(e.target)))ssClose()},true);
  window.addEventListener('scroll',ssPlace,true);window.addEventListener('resize',ssPlace);
  if(window.visualViewport)window.visualViewport.addEventListener('resize',ssPlace);
  let q=0;
  const run=()=>{q=0;document.querySelectorAll('select').forEach(s=>{ssEnhance(s);ssSync(s)});if(cur&&!document.body.contains(cur))ssClose()};
  new MutationObserver(ms=>{if(q)return;if(ms.every(m=>m.target.closest&&m.target.closest('.ssb,.ssp')))return;q=requestAnimationFrame(run)}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled']});
  run();
})();

/* ================= START ================= */
init();
render();
</script>
